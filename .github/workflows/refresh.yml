name: Refresh data

on:
  schedule:
    # The live numbers come from Supabase; this only keeps the offline copy
    # baked into index.html from going stale.
    - cron: '25 12 * * 1'      # Mondays, 08:25 America/New_York
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # build.py is standard library only — nothing to install.
      - name: Pull the day's numbers
        run: python3 tools/build.py

      - name: Commit if anything moved
        run: |
          git config user.name "rbi-percentage"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet --cached; then
            echo "No change."
            exit 0
          fi
          git commit -m "Refresh data $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
